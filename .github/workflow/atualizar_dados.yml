name: Atualizar dados do mapa

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: America/Sao_Paulo
      RSS_URL: https://idapfile.mdr.gov.br/idap/api/rss/cap
      HISTORY_PATH: .cache/historico_alertas_idap.json
      WINDOW_HOURS: '24'
      RETENTION_HOURS: '72'
      REQUEST_TIMEOUT_SEC: '45'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip

      - name: Criar cache local
        run: |
          mkdir -p .cache
          [ -f .cache/historico_alertas_idap.json ] || echo '[]' > .cache/historico_alertas_idap.json

      - name: Atualizar IDAP
        run: python scripts/fetch_idap.py

      - name: Atualizar CEMADEN
        run: python scripts/fetch_cemaden.py

      - name: Atualizar INMET
        run: python scripts/fetch_inmet.py

      - name: Atualizar SGB
        run: python scripts/fetch_sgb.py

      - name: Commitar alterações
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .cache/historico_alertas_idap.json data/*.geojson data/catalogo_camadas.json

          if git diff --cached --quiet; then
            echo 'Nenhuma alteração para commit.'
            exit 0
          fi

          git commit -m 'Atualiza dados do mapa [skip ci]'
          git push
