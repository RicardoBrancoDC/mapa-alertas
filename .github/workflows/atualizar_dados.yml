name: Atualizar dados do mapa

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-camadas:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Criar diretórios de cache
        run: |
          mkdir -p .cache
          [ -f .cache/historico_alertas_idap.json ] || echo "[]" > .cache/historico_alertas_idap.json

      - name: Atualizar camada IDAP
        env:
          TZ: "America/Sao_Paulo"
          RSS_URL: "https://idapfile.mdr.gov.br/idap/api/rss/cap"
          HISTORY_PATH: ".cache/historico_alertas_idap.json"
          WINDOW_HOURS: "24"
          RETENTION_HOURS: "72"
          REQUEST_TIMEOUT_SEC: "45"
        run: |
          python scripts/fetch_idap.py

      - name: Atualizar camada CEMADEN
        env:
          TZ: "America/Sao_Paulo"
        run: |
          python scripts/fetch_cemaden.py

      - name: Atualizar camada SGB
        env:
          TZ: "America/Sao_Paulo"
          SGB_URL: "https://www.sgb.gov.br/sace/sace_nivel/api_estacoes_situacao.php"
          REQUEST_TIMEOUT_SEC: "45"
        run: |
          python scripts/fetch_sgb.py

      - name: Mostrar arquivos gerados
        run: |
          echo "Arquivos na pasta data:"
          find data -maxdepth 1 -type f | sort

      - name: Commit e push se houver mudanças
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .cache/historico_alertas_idap.json \
                  data/idap_ativos.geojson \
                  data/idap_inativos.geojson \
                  data/cemaden_hidro.geojson \
                  data/cemaden_geo.geojson \
                  data/sgb_estacoes.geojson

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commit."
            exit 0
          fi

          git commit -m "Atualiza camadas IDAP, CEMADEN e SGB [skip ci]"
          git push
