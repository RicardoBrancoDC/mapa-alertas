name: Atualizar camadas do mapa

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Criar pastas necessárias
        run: |
          mkdir -p data .cache

      - name: Garantir cache da IDAP
        run: |
          [ -f .cache/historico_alertas_idap.json ] || echo "[]" > .cache/historico_alertas_idap.json

      - name: Atualizar camada IDAP
        env:
          IDAP_RSS_URL: "https://idapfile.mdr.gov.br/idap/api/rss/cap"
          IDAP_HISTORY_PATH: ".cache/historico_alertas_idap.json"
          IDAP_WINDOW_HOURS: "24"
          REQUEST_TIMEOUT_SEC: "30"
        run: |
          python scripts/fetch_idap.py

      - name: Atualizar camada CEMADEN
        env:
          CEMADEN_URL: "https://painelalertas.cemaden.gov.br/wsAlertas2"
          REQUEST_TIMEOUT_SEC: "30"
        run: |
          python scripts/fetch_cemaden.py

      - name: Atualizar camada SGB
        env:
          SGB_URL: "https://www.sgb.gov.br/sace/sace_nivel/api_estacoes_situacao.php"
          REQUEST_TIMEOUT_SEC: "30"
        run: |
          python scripts/fetch_sgb.py

      - name: Atualizar camada INMET
        env:
          INMET_RSS_URL: "https://apiprevmet3.inmet.gov.br/avisos/rss"
          INMET_TIME_FILTER: "today"
          REQUEST_TIMEOUT_SEC: "30"
        run: |
          python scripts/fetch_inmet.py

      - name: Commit e push se houver alterações
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             .cache/historico_alertas_idap.json             data/idap_ativos.geojson             data/idap_inativos.geojson             data/cemaden_hidro.geojson             data/cemaden_geo.geojson             data/sgb_estacoes.geojson             data/inmet_alertas.geojson             data/inmet_status.json             data/catalogo_camadas.json || true

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commit."
            exit 0
          fi

          git commit -m "Atualiza dados do painel [skip ci]"
          git push
